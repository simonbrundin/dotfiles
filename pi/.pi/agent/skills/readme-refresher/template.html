    function updateServerStatus(connected) {
      serverConnected = connected;
      const el = document.getElementById('server-status');

      el.innerHTML = `<span class="status-dot"></span>${connected ? 'Ansluten' : 'Ej ansluten'}`;

    function renderSummary() {

      const removed = changes.filter(c => c.type === 'removed').length;
      const modified = changes.filter(c => c.type === 'modified').length;
      const accepted = changes.filter(c => c.status === 'accepted').length;
      const progress = Math.round((accepted / changes.length) * 100);
      document.getElementById('summary-added').textContent = `+${added}`;
      document.getElementById('summary-removed').textContent = `-${removed}`;
      document.getElementById('summary-modified').textContent = `~${modified}`;
      document.getElementById('summary-progress').textContent = `${progress}% klart`;
    }

    function renderChanges() {
      const container = document.getElementById('changes-container');
      container.innerHTML = changes.map((change, index) => renderChangeCard(change, index)).join('');
    }

    function renderChangeCard(change, index) {
      const isCurrent = index === currentIndex;
      const isHidden = currentFilter !== 'all' && change.type !== currentFilter;
      let diffLines = '';
      if (change.type === 'removed') {
        change.linesBefore.forEach(line => {
          diffLines += `<div class="line line-removed"><span class="line-prefix">-</span><span class="line-content">${escapeHtml(line)}</span></div>`;
        });
      } else if (change.type === 'added') {
        change.linesAfter.forEach(line => {
          diffLines += `<div class="line line-added"><span class="line-prefix">+</span><span class="line-content">${escapeHtml(line)}</span></div>`;
        });
      } else if (change.type === 'modified') {
        const maxLines = Math.max(change.linesBefore.length, change.linesAfter.length);
        for (let i = 0; i < maxLines; i++) {
          const before = change.linesBefore[i] || '';
          const after = change.linesAfter[i] || '';
          if (before !== after) {
            if (before) diffLines += `<div class="line line-removed"><span class="line-prefix">-</span><span class="line-content">${escapeHtml(before)}</span></div>`;
            if (after) diffLines += `<div class="line line-added"><span class="line-prefix">+</span><span class="line-content">${escapeHtml(after)}</span></div>`;
          } else if (before) {
            diffLines += `<div class="line"><span class="line-prefix"> </span><span class="line-content">${escapeHtml(before)}</span></div>`;
          }
        }
      }
      let actionButtons = '';
      if (change.status === 'pending') {
        actionButtons = `<button class="btn btn-accept" onclick="acceptChange(${change.id})">✅ Acceptera</button><button class="btn btn-reject" onclick="rejectChange(${change.id})">❌ Avvisa</button><button class="btn btn-edit" onclick="editChange(${change.id})">✏️ Redigera</button>`;
      } else if (change.status === 'accepted') {
        actionButtons = `<span class="status-accepted">✅ Accepterad</span><button class="btn btn-reject" onclick="rejectChange(${change.id})">❌ Avvisa</button><button class="btn btn-edit" onclick="editChange(${change.id})">✏️ Redigera</button>`;
      } else {
        actionButtons = `<span class="status-rejected">❌ Avvisad</span><button class="btn btn-accept" onclick="acceptChange(${change.id})">✅ Acceptera</button>`;
      }
      return `<div class="change-card ${isCurrent ? 'current' : ''} ${isHidden ? 'hidden' : ''}" id="change-${change.id}" data-type="${change.type}"><div class="change-header"><span class="change-number">Ändring ${index + 1} av ${changes.length}</span><span class="change-type-badge type-${change.type}">${change.type === 'added' ? '+ Tillagt' : change.type === 'removed' ? '− Borttaget' : '~ Modifierat'}</span></div><div class="diff-view"><div class="diff-content">${diffLines}</div></div><div class="explanation"><div class="explanation-label">💬 Förklaring</div><p class="explanation-text">${change.explanation}</p></div><div class="actions">${actionButtons}</div></div>`;
    }

    function acceptChange(id) { const c = changes.find(x => x.id === id); if (c) { c.status = 'accepted'; renderAll(); } }
    function rejectChange(id) { const c = changes.find(x => x.id === id); if (c) { c.status = 'rejected'; renderAll(); } }
    function editChange(id) {
      const c = changes.find(x => x.id === id); if (!c) return;
      const modal = document.getElementById('edit-modal');
      document.getElementById('edit-title').textContent = `Redigera ändring ${id}`;
      document.getElementById('edit-textarea').value = c.linesAfter.join('\n');
      modal.dataset.changeId = id;
      modal.classList.add('active');
    }
    function saveEdit() {
      const modal = document.getElementById('edit-modal');
      const id = parseInt(modal.dataset.changeId);
      const newContent = document.getElementById('edit-textarea').value;
      const c = changes.find(x => x.id === id);
      if (c) { c.linesAfter = newContent.split('\n'); c.status = 'accepted'; renderAll(); }
      closeModal();
    }
    function closeModal() { document.getElementById('edit-modal').classList.remove('active'); }
    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
      document.querySelectorAll('.change-card').forEach(card => card.classList.toggle('hidden', filter !== 'all' && card.dataset.type !== filter));
    }
    function goToChange(index) {
      currentIndex = Math.max(0, Math.min(changes.length - 1, index));
      updateNavigation();
      document.querySelectorAll('.change-card').forEach((card, i) => card.classList.toggle('current', i === currentIndex));
      const card = document.getElementById(`change-${changes[currentIndex].id}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function updateNavigation() {
      document.getElementById('nav-info').textContent = `${currentIndex + 1} / ${changes.length}`;
      document.getElementById('nav-prev').disabled = currentIndex === 0;
      document.getElementById('nav-next').disabled = currentIndex === changes.length - 1;
    }

    function generateFinalReadme() {
      // Returnerar den kompletta uppdaterade README:n
      // baserat på vilka ändringar som accepteras
      return CONFIG.finalContent;
    }

    function renderPreview() {
      document.getElementById('preview-content').textContent = generateFinalReadme();
    }

    function renderAll() { renderSummary(); renderChanges(); renderPreview(); updateNavigation(); }

    async function saveToFile() {
      const finalContent = generateFinalReadme();
      try {
        const response = await fetch('http://localhost:8767/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: finalContent, path: CONFIG.readmePath })
        });
        const result = await response.json();
        showToast(result.success ? `✅ ${result.message}` : `❌ ${result.error}`, result.success ? 'success' : 'error');
      } catch (e) {
        downloadFile(finalContent, 'README.md');
        showToast('Server ej ansluten - laddar ner istället', 'error');
      }
    }

    async function openInEditor() {
      try {
        await fetch('http://localhost:8767/open', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: CONFIG.readmePath })
        });
      } catch (e) { console.error(e); }
    }

    function downloadFile(content, filename) {
      const blob = new Blob([content], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function resetAll() { if (confirm('Återställ alla ändringar?')) { changes.forEach(c => c.status = 'pending'); renderAll(); } }
    function showToast(message, type = '') { const t = document.getElementById('toast'); t.textContent = message; t.className = `toast show ${type}`; setTimeout(() => t.className = 'toast', 3000); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') goToChange(currentIndex - 1); if (e.key === 'ArrowRight') goToChange(currentIndex + 1); if (e.key === 'Escape') closeModal(); });
  </script>
  
  <div class="header">
    <div style="display: flex; align-items: center;">
      <h1>📝 README Diff — <span id="project-name">Laddar...</span></h1>
      <span class="readme-path" id="readme-path"></span>
    </div>
    <div id="server-status" class="server-status disconnected"><span class="status-dot"></span>Ej ansluten</div>
  </div>
  
  <div class="summary-bar">
    <div class="stat stat-added"><span class="stat-value" id="summary-added">+0</span><span>tillagt</span></div>
    <div class="stat stat-removed"><span class="stat-value" id="summary-removed">-0</span><span>borttaget</span></div>
    <div class="stat stat-modified"><span class="stat-value" id="summary-modified">~0</span><span>modifierat</span></div>
    <div class="stat"><span class="stat-value stat-progress" id="summary-progress">0% klart</span></div>
  </div>
  
  <div class="filter-bar">
    <span style="color: var(--text-muted); margin-right: 10px;">Filter:</span>
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Alla</button>
    <button class="filter-btn" data-filter="added" onclick="setFilter('added')">+ Tillagt</button>
    <button class="filter-btn" data-filter="removed" onclick="setFilter('removed')">- Borttaget</button>
    <button class="filter-btn" data-filter="modified" onclick="setFilter('modified')">~ Modifierat</button>
  </div>
  
  <div class="main"><div id="changes-container"></div></div>
  
  <div class="navigation">
    <button class="nav-btn" id="nav-prev" onclick="goToChange(currentIndex - 1)">◀ Föregående</button>
    <span class="nav-info" id="nav-info">1 / 1</span>
    <button class="nav-btn" id="nav-next" onclick="goToChange(currentIndex + 1)">Nästa ▶</button>
  </div>
  
  <div class="main">
    <div class="preview-section">
      <div class="preview-header"><span>👁️ Live Preview</span><span style="font-size: 12px; color: var(--text-muted)">Uppdateras i realtid</span></div>
      <div class="preview-content" id="preview-content"></div>
    </div>
  </div>
  
  <div class="footer-actions">
    <button class="btn btn-save" onclick="saveToFile()">💾 Spara till README.md</button>
    <button class="btn btn-open" onclick="openInEditor()">📂 Öppna i editor</button>
    <button class="btn btn-reset" onclick="resetAll()">🔄 Återställ</button>
  </div>
  
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header"><h3 id="edit-title">Redigera ändring</h3><button class="close-modal" onclick="closeModal()">×</button></div>
      <div class="modal-body"><textarea id="edit-textarea" placeholder="Skriv din egen version här..."></textarea></div>
      <div class="modal-footer"><button class="btn btn-reject" onclick="closeModal()">Avbryt</button><button class="btn btn-accept" onclick="saveEdit()">💾 Spara</button></div>
    </div>
  </div>
  
  <div id="toast" class="toast"></div>
  <script>init();</script>
</body>
</html>
